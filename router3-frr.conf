frr defaults traditional
hostname router3
!
interface eth1
 ip address 10.0.23.1/31
 ip ospf network point-to-point
 no shutdown
!
interface lo
 ip address 10.0.0.3/32
 no shutdown
!
router ospf
 ospf router-id 10.0.0.3
 network 10.0.0.3/32 area 0
 network 10.0.23.0/31 area 0
 passive-interface lo
!
line vty
!
