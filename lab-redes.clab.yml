name: lab-redes

topology:
  nodes:
    router1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - daemons:/etc/frr/daemons
        - router1-frr.conf:/etc/frr/frr.conf
    router2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - daemons:/etc/frr/daemons
        - router2-frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["router1:eth1", "router2:eth1"]
