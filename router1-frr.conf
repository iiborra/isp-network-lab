frr defaults traditional
hostname router1
!
interface eth1
 ip address 10.0.12.0/31
 ip ospf network point-to-point
 no shutdown
!
interface lo
 ip address 10.0.0.1/32
 no shutdown
!
router ospf
 ospf router-id 10.0.0.1
 network 10.0.0.1/32 area 0
 network 10.0.12.0/31 area 0
 passive-interface lo
!
line vty
!
